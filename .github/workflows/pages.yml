name: Publish Mixlab
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage verified separation model and runtime
        run: bash scripts/prepare-stems.sh
      - name: Version browser assets
        run: python3 scripts/version-assets.py site "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Verify published separation weights
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors "${PAGE_URL%/}/ai-assets/UVR_MDXNET_Main.onnx" -o "$RUNNER_TEMP/published.onnx"
          echo "8289784cda38543ff431add4070662813311a8cccfc0112ca82f76d9dba2b4ca  $RUNNER_TEMP/published.onnx" | sha256sum -c
