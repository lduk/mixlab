name: Stem browser checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/stems*.js'
      - 'tests/stem_editor.py'
      - '.github/workflows/stem-browsers.yml'
env:
  PYTHONUTF8: 1
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            browser: chromium
          - os: ubuntu-latest
            browser: firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/prepare-stems.sh
      - run: python -m pip install playwright
      - run: python -m playwright install ${{ matrix.browser }}
      - name: Separate and edit audio in the browser
        run: |
          python tests/stem_editor.py --serve --url http://127.0.0.1:8213/ --browser ${{ matrix.browser }} 2>&1 | tee test.log || { echo "::error::$(tail -c 650 test.log | tr '\n' ' ')"; exit 1; }
          tail -3 test.log >> "$GITHUB_STEP_SUMMARY"
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/prepare-stems.sh
      - run: python -m pip install playwright
      - name: Start Android with Chrome
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          trap 'echo "::error::Android setup failed at line $LINENO ($BASH_COMMAND)"' ERR
          sudo chmod a+rw /dev/kvm
          image='system-images;android-35;google_apis_playstore;x86_64'
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0 libgl1 libnss3 libxcb-cursor0 libxkbcommon-x11-0 libxkbfile1
          set +o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "emulator" "$image" > "$RUNNER_TEMP/android-sdk.log" 2>&1
          if ! "$ANDROID_HOME/emulator/emulator" -version > "$RUNNER_TEMP/version.log" 2>&1; then
            echo "::error::Android emulator installation: $(tail -c 700 "$RUNNER_TEMP/android-sdk.log" | tr '\r\n' ' ') $(tail -c 700 "$RUNNER_TEMP/version.log" | tr '\n' ' ')"
            exit 1
          fi
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mixlab-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n mixlab -k "$image" --device pixel_5 --path "$ANDROID_AVD_HOME/mixlab.avd"
          config="$ANDROID_AVD_HOME/mixlab.avd/config.ini"
          sed -i '/^disk.dataPartition.size=/d' "$config"
          echo 'disk.dataPartition.size=2048M' >> "$config"
          "$ANDROID_HOME/emulator/emulator" -avd mixlab -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          for attempt in {1..90}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::Emulator startup: $(tail -c 1000 "$RUNNER_TEMP/emulator.log" | tr '\n' ' ')"
              exit 1
            fi
            if adb devices | grep -q 'emulator-.*device'; then break; fi
            sleep 2
          done
          timeout 10 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 3; done'
          adb shell pm path com.android.chrome | grep -q package:
          adb shell input keyevent 82
          adb shell am set-debug-app --persistent com.android.chrome
          adb shell "echo 'chrome --no-first-run --disable-fre --disable-default-apps' > /data/local/tmp/chrome-command-line"
          adb shell am start -n com.android.chrome/com.google.android.apps.chrome.Main -a android.intent.action.VIEW -d http://127.0.0.1:8213/
          adb reverse tcp:8213 tcp:8213
          adb forward tcp:9222 localabstract:chrome_devtools_remote
          for attempt in {1..60}; do curl -fsS http://localhost:9222/json/version && break; sleep 2; done
          curl -fsS http://localhost:9222/json/version
      - name: Separate audio in Android Chrome
        shell: bash
        run: |
          python tests/stem_editor.py --serve --url http://127.0.0.1:8213/ --cdp http://127.0.0.1:9222 2>&1 | tee test.log || { echo "::error::$(tail -c 650 test.log | tr '\n' ' ')"; exit 1; }
          tail -3 test.log >> "$GITHUB_STEP_SUMMARY"
