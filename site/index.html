<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mixlab · Edytor audio</title><link rel="stylesheet" href="style.css">
<header><strong>◒ MIXLAB</strong><span>Edytor audio</span></header>
<main><h1>Twój miks</h1><p>Dodaj nagrania z urządzenia. Pliki są przetwarzane w tej karcie.</p>
<label class="import">＋ Dodaj pliki audio<input id="files" type="file" accept="audio/*" multiple></label>
<section><h2>Ścieżki miksu</h2><output id="clock"></output><p>Kliknij podziałkę, aby ustawić kursor. Przeciągnij po niej, aby zaznaczyć zakres pętli.</p>
<div class="toolbar"><label>Tryb <select id="mode"><option value="move">Przesuwanie</option><option value="trim">Przycinanie</option><option value="stretch">Zmiana tempa</option></select></label>
<label><input id="snap" type="checkbox" checked> Przyciąganie</label>
<label><input id="auto" type="checkbox" checked> Auto crossfade</label>
<label><input id="loop" type="checkbox"> Pętla</label>
<button id="split">Podziel przy kursorze</button><label>Powiększenie <select id="zoom"><option>1</option><option>2</option><option>4</option><option>16</option><option>64</option></select> ×</label></div><div class="timeline-scroll"><div id="timeline"><div id="ruler"></div><div id="loopBand"></div><div id="lanes"></div><i id="cursor"></i></div></div><output id="range"></output><ol id="list"></ol></section>
<section id="editor" hidden><h2 id="properties">Edytuj klip</h2><output id="length"></output><p>Przeciągnij po fali, aby zaznaczyć fragment.</p><canvas width="1000" height="120" aria-label="Przebieg nagrania z zaznaczonym fragmentem"></canvas><button id="trim" disabled>Przytnij do zaznaczenia</button><div class="fields">
<label>Od (s)<input id="begin" type="number" step="any" min="0"></label><label>Do (s)<input id="end" type="number" step="any" min="0"></label>
<label>Start w miksie (s)<input id="offset" type="number" min="0" step="any" placeholder="Po poprzednim"></label><label>Tempo (%)<input type="number" min="25" max="400" step="any" id="speed" list="presets"></label>
<datalist id="presets"><option value="50"><option value="75"><option value="90"><option value="100"><option value="110"><option value="125"><option value="150"><option value="200"></datalist><label><input type="checkbox" id="preserve"> Zachowaj tonację</label>
<label>Przejście<select id="curve"><option value="equal">Equal Power</option><option value="linear">Linear</option></select></label><label>Przejście (s)<input type="number" min="0" step="any" placeholder="Automatycznie" id="crossLength"></label>
<label>Głośność (%)<input id="volume" type="number" min="0" max="100"></label><label>Narastanie (s)<input id="fadeIn" type="number" min="0" step="any"></label><label>Wygaszanie (s)<input id="fadeOut" type="number" min="0" step="any"></label></div><button id="preview">▶ Odsłuch klipu</button> <button id="pauseClip" aria-label="Pauza lub wznowienie klipu" disabled>Pauza</button></section>
<footer><button id="play">▶ Odtwórz miks</button><button id="pauseMix" aria-label="Pauza lub wznowienie miksu" disabled>Pauza</button><button id="stop">Stop</button><button id="undo">Cofnij</button><button id="redo">Ponów</button><button id="save">↓ Eksport WAV</button><button id="mp3">↓ Eksport MP3</button></footer><p role="status" id="message"></p></main><script src="app.js" type="module"></script></html>
