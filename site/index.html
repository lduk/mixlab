<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MixLab · Edytor audio</title>
<link rel="stylesheet" href="style.css">
<main>
<article class="desk" aria-label="Edytor miksu">
<header><h1>MixLab</h1>
<div class="exports"><button id="exportMenu" aria-expanded="false" aria-controls="formats">Eksportuj ▾</button>
<div id="formats" hidden><button id="save">Eksport WAV</button><button id="mp3">Eksport MP3</button></div></div></header>
<div class="tools" aria-label="Narzędzia">
  <label class="import">＋ Audio<input id="files" type="file" multiple></label>
  <button id="openEffects" aria-haspopup="dialog">＋ Efekty</button>
  <div id="modes" role="group" aria-label="Tryb edycji">
    <button data-mode="move" aria-pressed="true">Przesuń</button>
    <button data-mode="trim" aria-pressed="false">Przytnij</button>
    <button data-mode="stretch" aria-pressed="false">Tempo</button>
    <button data-mode="attack" aria-pressed="false">Narastanie</button>
    <button data-mode="fade" aria-pressed="false">Wycisz</button>
  </div>
  <div class="history"><button id="undo" title="Cofnij" aria-label="Cofnij">↶</button><button id="redo" title="Ponów" aria-label="Ponów">↷</button></div>
</div>
<dialog id="effectsDialog" aria-labelledby="effectsTitle">
  <header><h2 id="effectsTitle">Efekty dźwiękowe</h2><button id="closeEffects" aria-label="Zamknij bibliotekę">✕</button></header>
  <p>Dodaj na nowej ścieżce w <strong id="effectTime"></strong>.</p>
  <div id="effectList"></div>
  <p id="effectStatus" role="status"></p>
</dialog>
<p class="hint" id="hint"></p>
<div class="timeline-scroll"><div id="timeline">
  <div id="ruler" title="Kliknij, aby ustawić kursor. Przeciągnij, aby zaznaczyć pętlę."></div>
  <div id="loopBand"></div><div id="lanes"></div><i id="cursor"></i>
  <i id="hoverGuide" hidden></i><span id="hoverTime" hidden></span>
</div></div>
<div class="transport">
  <button id="play" title="Odtwórz miks" aria-label="Odtwórz miks">▶</button>
  <button id="pauseMix" aria-label="Pauza lub wznowienie miksu" disabled>Pauza</button>
  <button id="stop" title="Stop" aria-label="Stop">■</button>
  <output id="clock"></output>
  <label><input id="snap" type="checkbox" checked> Przyciąganie</label>
  <label>Zoom <select id="zoom"><option>1</option><option>2</option><option>4</option><option>16</option><option>64</option></select>×</label>
</div>
<output id="range"></output>
<div class="options">
  <label><input id="auto" type="checkbox" checked> Auto crossfade</label>
  <label><input id="loop" type="checkbox"> Pętla</label>
  <button id="split">Podziel przy kursorze</button>
</div>
<p role="status" id="message"></p>
</article>
<details id="clipList"><summary>Lista klipów</summary><ol id="list"></ol></details>
<section id="editor" hidden><h2 id="properties">Edytuj klip</h2><output id="length"></output><p>Przeciągnij po fali, aby zaznaczyć fragment.</p><canvas width="1000" height="120" aria-label="Przebieg nagrania z zaznaczonym fragmentem"></canvas><button id="trim" disabled>Przytnij do zaznaczenia</button><div class="fields">
<label>Od (s)<input id="begin" type="number" step="any" min="0"></label><label>Do (s)<input id="end" type="number" step="any" min="0"></label>
<label>Start w miksie (s)<input id="offset" type="number" min="0" step="any" placeholder="Po poprzednim"></label><label>Tempo (%)<input type="number" min="25" max="400" step="any" id="speed" list="presets"></label>
<datalist id="presets"><option value="50"><option value="75"><option value="90"><option value="100"><option value="110"><option value="125"><option value="150"><option value="200"></datalist><label><input type="checkbox" id="preserve"> Zachowaj tonację</label>
<label>BPM źródłowe<input id="sourceBpm" type="number" step="any" placeholder="Wpisz BPM"></label>
<button id="estimateBpm">Oszacuj BPM</button>
<label>BPM docelowe<input id="targetBpm" type="number" step="any" disabled></label>
<output id="bpmStatus"></output>
<label>Przejście<select id="curve"><option value="equal">Equal Power</option><option value="linear">Linear</option></select></label><label>Przejście (s)<input type="number" min="0" step="any" placeholder="Automatycznie" id="crossLength"></label>
<label>Głośność (%)<input id="volume" type="number" min="0" max="100"></label><label>Narastanie (s)<input id="fadeIn" type="number" min="0" step="any"></label><label>Krzywa wejścia<select id="attackCurve"><option value="linear">Liniowa</option><option value="equal">Equal Power</option></select></label><label>Wygaszanie (s)<input id="fadeOut" type="number" min="0" step="any"></label></div><button id="preview">▶ Odsłuch klipu</button> <button id="pauseClip" aria-label="Pauza lub wznowienie klipu" disabled>Pauza</button></section>

</main><script src="app.js" type="module"></script></html>
